info:
  name: Add Announcement
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/announcements
  body:
    type: json
    data: |-
      {
        "content": "Zbiorka na remont dachu odbedzie sie bezposrednio po zakonczeniu mszy.",
        "eventId": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 201", function() {
            expect(res.getStatus()).to.equal(201);
        });
        test("Response contains announcement id", function() {
            const body = res.getBody();
            expect(body).to.have.property("id");
            expect(body.eventId).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
